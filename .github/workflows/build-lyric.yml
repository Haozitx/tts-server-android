name: Build Lyric Overlay APK

on:
  push:
    branches: [ "feat/lyric-overlay" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate signing key and local.properties
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/app/lyric-key.jks" \
            -alias lyric \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lyric123456 -keypass lyric123456 \
            -dname "CN=Lyric Overlay, OU=DIY, O=Haozitx, L=Beijing, ST=Beijing, C=CN"
          {
            echo "KEY_PATH=./lyric-key.jks"
            echo "KEY_PASSWORD=lyric123456"
            echo "ALIAS_NAME=lyric"
            echo "ALIAS_PASSWORD=lyric123456"
          } > local.properties
          cat local.properties

      # 必须 release：debug 不做 R8，slf4j-api 2.x 默认方法会抛
      # AbstractMethodError: Logger.atLevel，一朗读就闪退（与歌词代码无关）。
      # R8 吃内存，这里显式给 4G 堆，避开 OOM。
      - name: Build lyric flavor APK (release)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleLyricRelease \
            --build-cache --parallel --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tts-server-lyric-release-apk
          path: app/build/outputs/apk/lyric/release/*.apk
          if-no-files-found: error

      # 失败时把关键行推到 ci-logs 分支，方便直接读取（Actions 日志需要登录态）
      - name: Dump failure log to branch
        if: failure()
        run: |
          grep -nE "^(e: |error:|FAILURE|What went wrong|Caused by:|Execution failed|> Task .*FAILED|A failure occurred)" build.log > ci-failure.log || true
          if [ ! -s ci-failure.log ]; then tail -n 300 build.log > ci-failure.log; fi
          echo "==== 日志行数：$(wc -l < build.log) ====" >> ci-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-failure.log
          git commit -m "ci: release 构建失败日志"
          git push -f origin ci-logs

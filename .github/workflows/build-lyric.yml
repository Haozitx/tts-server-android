# 构建触发：固定签名后首次构建（2026-09-25）
# 签名密钥已固定并暂存于仓库 Secrets：LYRIC_KEYSTORE_B64
# 预期：本构建产物与上一版签名一致，可直接覆盖升级
name: Build Lyric Overlay APK

on:
  push:
    branches: [ "feat/lyric-overlay" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 签名密钥固定下来，不再每次现生成——
      # 现生成的密钥每跑一次都不一样，系统认为是两个作者，无法覆盖安装。
      # 优先读仓库 Secrets；没有才退回仓库内的 base64 文件；两者都没有就直接失败。
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.LYRIC_KEYSTORE_B64 }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 -d > app/lyric-key.jks
            echo "签名密钥来源：仓库 Secrets（LYRIC_KEYSTORE_B64）"
          elif [ -f .github/lyric-key.b64 ]; then
            tr -d '\r\n' < .github/lyric-key.b64 | base64 -d > app/lyric-key.jks
            echo "签名密钥来源：仓库内 .github/lyric-key.b64（公开可下载）"
          else
            echo "::error::找不到固定签名密钥。请在 Settings > Secrets and variables > Actions 新建 LYRIC_KEYSTORE_B64，或把密钥 base64 提交为 .github/lyric-key.b64。"
            exit 1
          fi
          keytool -list -keystore app/lyric-key.jks -storepass lyric123456 | tail -4
          {
            echo "KEY_PATH=./lyric-key.jks"
            echo "KEY_PASSWORD=lyric123456"
            echo "ALIAS_NAME=lyric"
            echo "ALIAS_PASSWORD=lyric123456"
          } > local.properties
          cat local.properties

      # 必须 release：debug 不做 R8，slf4j-api 2.x 默认方法会抛
      # AbstractMethodError: Logger.atLevel，一朗读就闪退（与歌词代码无关）。
      # R8 吃内存，这里显式给 4G 堆，避开 OOM。
      - name: Build lyric flavor APK (release)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleLyricRelease \
            --build-cache --parallel --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" 2>&1 | tee build.log

      # 把产物实际用的签名指纹打出来，好确认「固定签名」真的生效
      - name: Verify APK signer
        if: success()
        run: |
          APK=$(ls app/build/outputs/apk/lyric/release/*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -8
          else
            echo "未找到 apksigner，改用 keytool 读证书"
            keytool -printcert -jarfile "$APK" 2>&1 | head -8
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tts-server-lyric-release-apk
          path: app/build/outputs/apk/lyric/release/*.apk
          if-no-files-found: error

      # 推到 Release，给一个不需登录的直链（手机侧才能自动下载安装）
      - name: Publish APK to Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/lyric/release/*.apk lyric-overlay.apk
          ls -l lyric-overlay.apk
          gh release view lyric-build >/dev/null 2>&1 \
            || gh release create lyric-build --title "歌词版（自动构建）" \
                 --notes "自动构建产物，每次 push 覆盖更新。" --prerelease
          gh release upload lyric-build lyric-overlay.apk --clobber

      # 失败时把关键行推到 ci-logs 分支，方便直接读取（Actions 日志需要登录态）
      - name: Dump failure log to branch
        if: failure()
        run: |
          grep -nE "^(e: |error:|FAILURE|What went wrong|Caused by:|Execution failed|> Task .*FAILED|A failure occurred)" build.log > ci-failure.log || true
          if [ ! -s ci-failure.log ]; then tail -n 300 build.log > ci-failure.log; fi
          echo "==== 日志行数：$(wc -l < build.log) ====" >> ci-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-failure.log
          git commit -m "ci: 构建失败日志"
          git push -f origin ci-logs

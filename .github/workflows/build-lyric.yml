name: Build Lyric Overlay APK

on:
  push:
    branches: [ "feat/lyric-overlay" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate signing key and local.properties
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/app/lyric-key.jks" \
            -alias lyric \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lyric123456 -keypass lyric123456 \
            -dname "CN=Lyric Overlay, OU=DIY, O=Haozitx, L=Beijing, ST=Beijing, C=CN"
          {
            echo "KEY_PATH=./lyric-key.jks"
            echo "KEY_PASSWORD=lyric123456"
            echo "ALIAS_NAME=lyric"
            echo "ALIAS_PASSWORD=lyric123456"
          } > local.properties
          cat local.properties

      # 注意：必须构建 release。debug 构建不做 R8，slf4j-api 2.x 接口与
      # logback 旧实现类混在一起会抛 AbstractMethodError: Logger.atLevel，
      # 一朗读就闪退（与悬浮歌词代码无关，上游 debug 构建同样会崩）。
      - name: Build lyric flavor APK (release)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleLyricRelease --build-cache --parallel --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tts-server-lyric-release-apk
          path: app/build/outputs/apk/lyric/release/*.apk
          if-no-files-found: error

      - name: Report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -nE "^(e: |error:|FAILURE|What went wrong|Caused by:|Execution failed)" build.log > err.txt || true
          if [ ! -s err.txt ]; then tail -n 150 build.log > err.txt; fi
          {
            echo "CI 编译失败，下面是自动摘出的关键行。"
            echo ""
            echo '```'
            head -n 160 err.txt
            echo '```'
          } > body.md
          NUM=$(gh issue list --state open --search "CI in:title" --json number -q '.[0].number' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file body.md
          else
            gh issue create --title "CI 编译错误（自动上报）" --body-file body.md
          fi
